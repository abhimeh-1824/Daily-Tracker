<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In — Personal Study Tracker</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
  </head>
  <body>
    <div class="auth-page-container">
      <div class="auth-card">
        <div class="auth-header">
          <div class="auth-brand-logo">
            <div class="brand-icon">
              <i data-lucide="compass" style="width: 22px; height: 22px;"></i>
            </div>
            <span>StudyTracker</span>
          </div>
          <h2 style="font-size: 20px; font-weight: 700; color: #fff;">Consistency Dashboard</h2>
          <p style="font-size: 13px; color: var(--text-secondary); margin-top: 4px;">Sign in to sync your study timetable across devices</p>
        </div>

        <div class="auth-tabs">
          <div class="auth-tab active" id="tab-login">Sign In</div>
          <div class="auth-tab" id="tab-signup">Register</div>
        </div>

        <div style="background: rgba(14, 165, 233, 0.08); border: 1px solid rgba(14, 165, 233, 0.25); border-radius: 8px; padding: 10px 12px; margin-bottom: 16px; font-size: 12px; line-height: 1.45; color: var(--text-secondary);">
          <div style="color: #fff; font-weight: 600; margin-bottom: 2px;">Firebase Cloud Authentication</div>
          <div>Enable <strong>Email/Password</strong> under <a href="https://console.firebase.google.com/project/tidy-marker-fmn89/authentication/providers" target="_blank" rel="noopener noreferrer" style="color: var(--teal-primary); text-decoration: underline; font-weight: 600;">Firebase Console &gt; Sign-in providers</a> to sync across devices.</div>
        </div>

        <form id="standalone-login-form">
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <div class="form-input-wrapper">
              <input type="email" id="s-login-email" style="width: 100%;" placeholder="name@example.com" required />
            </div>
          </div>

          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
              <label class="form-label" style="margin-bottom: 0;">Password</label>
              <button type="button" id="s-forgot-btn" style="font-size: 12px; color: var(--teal-primary);">Forgot?</button>
            </div>
            <div class="form-input-wrapper">
              <input type="password" id="s-login-password" style="width: 100%;" placeholder="••••••••" required />
            </div>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; padding: 11px; margin-top: 6px;">
            Sign In
          </button>

          <a href="/index.html" class="btn btn-secondary btn-sm" style="width: 100%; margin-top: 12px; text-align: center;">
            Open Dashboard
          </a>
        </form>
      </div>
    </div>

    <div id="toast-container"></div>

    <script type="module">
      import { loginUser, resetPassword, subscribeAuth } from '/js/auth.js';
      import { showToast, refreshIcons } from '/js/utils.js';

      refreshIcons();

      subscribeAuth((user) => {
        if (user) {
          window.location.href = '/index.html';
        }
      });

      const form = document.getElementById('standalone-login-form');
      if (form) {
        form.onsubmit = async (e) => {
          e.preventDefault();
          const email = document.getElementById('s-login-email').value;
          const pass = document.getElementById('s-login-password').value;
          try {
            await loginUser(email, pass);
            window.location.href = '/index.html';
          } catch (err) {
            console.error(err);
          }
        };
      }

      const forgotBtn = document.getElementById('s-forgot-btn');
      if (forgotBtn) {
        forgotBtn.onclick = async () => {
          const email = prompt('Enter your registered email address:');
          if (email) {
            await resetPassword(email);
          }
        };
      }
    </script>
  </body>
</html>

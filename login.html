<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In — Personal Study Tracker</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
  </head>
  <body>
    <div class="auth-page-container">
      <div class="auth-card">
        <div class="auth-header">
          <div class="auth-brand-logo">
            <div class="brand-icon">
              <i data-lucide="compass" style="width: 22px; height: 22px;"></i>
            </div>
            <span>StudyTracker</span>
          </div>
          <h2 style="font-size: 20px; font-weight: 700; color: #fff;">Consistency Dashboard</h2>
          <p style="font-size: 13px; color: var(--text-secondary); margin-top: 4px;">Sign in to sync your study timetable across devices</p>
        </div>

        <!-- Quick Sign-In with Google -->
        <button type="button" id="btn-google-auth" class="btn btn-secondary" style="width: 100%; padding: 11px; margin-bottom: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; background-color: var(--bg-tertiary);">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          Continue with Google
        </button>

        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 16px;">
          <div style="flex: 1; height: 1px; background-color: var(--border-subtle);"></div>
          <span style="font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 600;">or email</span>
          <div style="flex: 1; height: 1px; background-color: var(--border-subtle);"></div>
        </div>

        <div class="auth-tabs">
          <div class="auth-tab active" id="tab-login">Sign In</div>
          <div class="auth-tab" id="tab-signup">Register</div>
        </div>

        <form id="standalone-login-form">
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <div class="form-input-wrapper">
              <input type="email" id="s-login-email" style="width: 100%;" placeholder="name@example.com" required />
            </div>
          </div>

          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
              <label class="form-label" style="margin-bottom: 0;">Password</label>
              <button type="button" id="s-forgot-btn" style="font-size: 12px; color: var(--teal-primary);">Forgot?</button>
            </div>
            <div class="form-input-wrapper">
              <input type="password" id="s-login-password" style="width: 100%;" placeholder="••••••••" required />
            </div>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; padding: 11px; margin-top: 6px;">
            Sign In
          </button>

          <a href="/index.html" class="btn btn-secondary btn-sm" style="width: 100%; margin-top: 12px; text-align: center;">
            Open Dashboard
          </a>
        </form>
      </div>
    </div>

    <div id="toast-container"></div>

    <script type="module">
      import { loginUser, loginWithGoogle, resetPassword, subscribeAuth } from '/js/auth.js';
      import { showToast, refreshIcons } from '/js/utils.js';

      refreshIcons();

      subscribeAuth((user) => {
        if (user) {
          window.location.href = '/index.html';
        }
      });

      const googleBtn = document.getElementById('btn-google-auth');
      if (googleBtn) {
        googleBtn.onclick = async () => {
          try {
            await loginWithGoogle();
          } catch (err) {
            console.error(err);
          }
        };
      }

      const form = document.getElementById('standalone-login-form');
      if (form) {
        form.onsubmit = async (e) => {
          e.preventDefault();
          const email = document.getElementById('s-login-email').value;
          const pass = document.getElementById('s-login-password').value;
          try {
            await loginUser(email, pass);
            window.location.href = '/index.html';
          } catch (err) {
            console.error(err);
          }
        };
      }

      const forgotBtn = document.getElementById('s-forgot-btn');
      if (forgotBtn) {
        forgotBtn.onclick = async () => {
          const email = prompt('Enter your registered email address:');
          if (email) {
            await resetPassword(email);
          }
        };
      }
    </script>
  </body>
</html>
